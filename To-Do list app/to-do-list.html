<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <title>To-Do List App</title>
  </head>
  <body>
    <main class="container">
      <aside class="leftbar">
        <div class="menu-part">
          <img src="images/kmlogo.jfif" alt="KM Logo" class="km-logo" />

          <h3>Menu</h3>
        </div>
        <div class="search-bar">
          <input
            type="text"
            placeholder=" 🔎  Search"
            name="Search bar"
            class="search-bar"
          />
        </div>

        <div class="filters">
          <button data-filter="active">Active</button>

          <button data-filter="completed">Completed</button>
        </div>
      </aside>

      <section class="task-control">
        <div class="todo-bar">
          <form class="add-task">
            <input type="text" placeholder="Enter task here" name="entertask" />

            <button type="submit">Add</button>
          </form>
        </div>

        <section class="task-lists">
          <ul>
            <li>
              <input type="checkbox" /><span>Learn HTML</span
              ><button type="button">Edit</button
              ><button type="button">Delete</button>
            </li>

            <li>
              <input type="checkbox" /><span>Learn CSS</span
              ><button type="button">Edit</button
              ><button type="button">Delete</button>
            </li>

            <li>
              <input type="checkbox" /><span>JavaScript</span>
              <button type="button">Edit</button
              ><button type="button">Delete</button>
            </li>
          </ul>
        </section>
      </section>

      <section class="completed">
        <ul></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
